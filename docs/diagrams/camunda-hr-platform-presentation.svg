    .title { font-size: 54px; font-weight: 700; }
    .panel-title { font-size: 34px; font-weight: 700; }
    .body { font-size: 24px; }
    .small { font-size: 20px; }
    .panel { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 3; rx: 8; }

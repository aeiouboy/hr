<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 4800 3200">
  <rect width="4800" height="3200" fill="#ffffff"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #1e1e1e; }
